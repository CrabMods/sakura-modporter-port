# Reusable second-port target. Fill the candidate path and SHA-256 after build.
# Paths must use forward slashes, including on Windows.
targetModId=sakura
targetJarPath=
targetJarSha256=

# Pinned source-derived completeness contract, relative to this validation project.
expectedContentManifestPath=targets/sakura.expected-content.json
expectedContentManifestSha256=abdf988bac0e973f1a09c833e4fef38fc23b3c2b69a29d7afce0bb1e5231482b
pristineWorldPath=

# Sakura declares Mysterious Mountain Lib as required. ModDevGradle resolves it

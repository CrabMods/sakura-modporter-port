plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
     // This should be below the net.minecraftforge.gradle plugin
//    id 'org.parchmentmc.librarian.forgegradle' version '1.+'

    // Apply the plugin. You can find the latest version at https://projects.neoforged.net/neoforged/ModDevGradle
    id("net.neoforged.moddev") version "2.0.140"
}

version = '1.0.10-1.21.1-modporter.1'
group = 'cn.mcmod.sakura' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'Sakura'

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
neoForge {
validateAccessTransformers = true
accessTransformers {
    file('src/main/resources/META-INF/accesstransformer.cfg')
}
    version = project.neo_forge_version

    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        clientWorld {
            client()
            programArguments.addAll '--quickPlayPath', 'quickplay/modporter_smoke_world.json', '--quickPlaySingleplayer', 'modporter_smoke_world'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach {
    doLast {
        def gameTestStructures = file('src/main/resources/gameteststructures')
        if (gameTestStructures.exists()) {
            copy {
                from gameTestStructures
                into file('run/gameteststructures')
            }
        }
    }
}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version            : version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Include resources generated by data generators.
repositories {
    maven { url = "https://maven.fabricmc.net/" }
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    maven { url = "https://raw.github.com/0999312/MMMaven/main/repository" }
    maven {
        url = "https://maven.theillusivec4.top/"
    }

    // Patchouli
    maven { url = 'https://maven.blamejared.com' }

    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {

    compileOnly "maven.modrinth:mmlib:1.3.16-1.21.1"
    runtimeOnly "maven.modrinth:mmlib:1.3.16-1.21.1"
    // Compile against only the API artifact
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.2.3+1.21.1:api"
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.2.3+1.21.1"
    compileOnly "net.fabricmc:fabric-loader:0.16.14"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.2.3+1.21.1"
    // Use the full Curios API jar at runtime
    compileOnly "maven.modrinth:patchouli:1.21.1-93-neoforge"
    runtimeOnly "maven.modrinth:patchouli:1.21.1-93-neoforge"

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.2.313"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.21.2.313"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.2.313"
    // at runtime, use the full JEI jar for Forge

    //implementation ("maven.modrinth:epic-fight:20.9.2")
    compileOnly "maven.modrinth:farmers-delight:1.21.1-1.3.4"
    runtimeOnly "maven.modrinth:farmers-delight:1.21.1-1.3.4"
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "sakura",
                "Specification-Vendor"    : "tracen_minecraft_group",
                "Specification-Version"   : "0.0.2",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "tracen_minecraft_group",
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${maven_loc}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// modporter-publication-policy-v1
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    from('MODPORTER-NOTICE') { into 'META-INF' }
    from('MODPORTER-PROVENANCE.json') { into 'META-INF' }
    from('MODPORTER-SUPPORT-LICENSE') { into 'META-INF' }
    from('MODPORTER-SUPPORT-NOTICE') { into 'META-INF' }

}

apply from: 'gradle/modporter-testing.gradle'
